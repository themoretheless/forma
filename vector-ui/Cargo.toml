[package]
name = "forma"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "forma"
path = "src/main.rs"
required-features = ["native"]

[features]
native = ["dep:winit", "dep:softbuffer", "gpu", "dep:objc"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
wasm-bindgen = "=0.2.125"
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
ttf-parser = "0.25.1"
wgpu = { version = "=29.0.4", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }

[dev-dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = { version = "0.2", optional = true }

# The runtime is compute-bound on every keystroke: it parses the document and frames the
# template transport in one pass, so whole-program inlining matters more than build time.
[profile.release]
codegen-units = 1
lto = "fat"
