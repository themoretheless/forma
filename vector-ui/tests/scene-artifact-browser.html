<!doctype html><meta charset="utf-8"><title>Forma scene artifact browser check</title>
<style>body{font:16px system-ui;background:#eff2f5;padding:24px}canvas{background:white;border:1px solid #9ba4af}pre{white-space:pre-wrap}#status{font-weight:600}</style>
<h1>Scene artifact</h1><p id="status">Loading WASM…</p><canvas width="360" height="400"></canvas><pre id="report"></pre>
<script type="module">
import init, { Button, Runtime, text_metrics, shaped_text_metrics } from './forma.js';
const report={status:'running',userAgent:navigator.userAgent,cases:[]};
const equal=(a,b)=>{if(JSON.stringify(a)!==JSON.stringify(b))throw Error(`${JSON.stringify(a)} != ${JSON.stringify(b)}`);};
async function check(name,fn){try{await fn();report.cases.push({name,status:'passed'});}catch(error){report.cases.push({name,status:'failed',error:String(error.stack??error)});}}
let runtime;
try{
 await init();runtime=new Runtime();
 const compile=height=>Runtime.compile_ui_scene_artifact(JSON.stringify({'App.ui':`component App { Column { width:360; height:400; Scroll { width:320; height:300; Column { width:100; height:${height}; } } } }`}), 'App.ui','{}');
 const json=compile(512),artifact=JSON.parse(json);
 await check('browser Rust compile and complete JSON load',()=>{equal(artifact.protocol,'forma-scene-artifact/1');runtime.load_scene_artifact(json);equal(Array.from(runtime.viewport()),[20,50,320,300]);equal(runtime.control_count(),0);});
 const before=runtime.pixels(360,400,1).slice();
 await check('empty layout extent and scrollbar pixels remain clipped',()=>{
  runtime.scroll(0,10000);equal(Array.from(runtime.scroll_offset()),[0,212]);
  const after=runtime.pixels(360,400,1);let changed=0,outside=0;
  for(let y=0;y<400;y++)for(let x=0;x<360;x++)for(let c=0;c<4;c++)if(before[(y*360+x)*4+c]!==after[(y*360+x)*4+c]){changed++;if(x<20||x>=340||y<50||y>=350)outside++;}
  if(!changed)throw Error('Scrollbar pixels did not change');equal(outside,0);report.changedBytes=changed;
 });
 await check('refused malformed/version/extent loads preserve live scene',()=>{
  const revision=runtime.layout_revision();for(const bad of ['{',json.replace('forma-scene-artifact/1','forma-scene-artifact/99'),JSON.stringify({...artifact,logical_content_end:[-1,500]})]){
   let refused=false;try{runtime.load_scene_artifact(bad);}catch{refused=true;}if(!refused)throw Error('Invalid artifact accepted');equal(runtime.layout_revision(),revision);equal(Array.from(runtime.scroll_offset()),[0,212]);
  }
 });
 await check('CPU frames render at fractional and Retina scales',()=>{for(const scale of [1,1.25,2]){const w=Math.ceil(360*scale),h=Math.ceil(400*scale);equal(runtime.pixels(w,h,scale).length,w*h*4);}});
 const pixels=runtime.pixels(360,400,1);document.querySelector('canvas').getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(pixels),360,400),0,0);
 await check('valid replacement shrinks logical content and revises caches',()=>{const revision=runtime.layout_revision();runtime.load_scene_artifact(compile(200));runtime.scroll(0,10000);equal(Array.from(runtime.scroll_offset()),[0,0]);if(runtime.layout_revision()===revision)throw Error('Revision did not change');});
 for(const chained of [false,true])await check(`browser input/CPU frame commits ${chained?'chained':'single'} Let alias`,()=>{
  const files={'App.ui':"component App { state items: List = []; Column { width:360; height:200; let visible = state.items; for item in visible key item.id { TextInput { width:200; height:32; value <-> item.title; } } } }".replace('for item in visible',chained?'let chosen = visible; for item in chosen':'for item in visible')};
  const view=new Runtime();
  try{view.load_ui_files_json(JSON.stringify(files),'App.ui',JSON.stringify({items:[{id:'a',title:'Alpha'},{id:'b',title:'Beta'}]}));equal(view.control_count(),2);if(!view.focus_control(0))throw Error('Input focus refused');view.tick(1000);
   const bounds=Array.from(view.control_bounds(0)),before=view.pixels(360,200,1).slice();
   if(!view.text_insert('—правка'))throw Error('Input insert refused');const edited=view.text_value(0);if(!edited.includes('—правка'))throw Error('Unicode input lost');equal(view.sync_ui_bindings(),true);
   equal(JSON.parse(view.ui_state_json()).items.map(x=>x.title),[edited,'Beta']);equal(view.sync_ui_bindings(),false);view.tick(1000);
   const pixels=view.pixels(360,200,1).slice();let changed=0,inside=0;
   for(let y=0;y<200;y++)for(let x=0;x<360;x++)for(let c=0;c<4;c++)if(before[(y*360+x)*4+c]!==pixels[(y*360+x)*4+c]){changed++;if(x>=bounds[0]&&x<bounds[0]+bounds[2]&&y>=bounds[1]&&y<bounds[1]+bounds[3])inside++;}
   if(!inside)throw Error('Edited input has no changed pixels within its bounds');
   for(const scale of [1,1.25,2]){const w=Math.ceil(360*scale),h=Math.ceil(200*scale);equal(view.pixels(w,h,scale).length,w*h*4);}
   const figure=document.createElement('figure'),caption=document.createElement('figcaption'),canvas=document.createElement('canvas');caption.textContent=(chained?'Chained':'Single')+' Let alias: '+edited;canvas.width=360;canvas.height=200;canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(pixels),360,200),0,0);figure.append(caption,canvas);document.querySelector('#report').before(figure);
   (report.aliasFrames??=[]).push({chained,edited,changedBytes:changed,changedBytesInsideControl:inside,bounds});
  }finally{view.free();}
 });
 await check('browser custom template reads transferred props.__state and updates visible text',()=>{
  const files={'App.ui':"component App { use 'Caption.ui'; state caption: String = 'initial'; Column { width:360; height:200; Caption {} } }",'Caption.ui':"component Caption { width:200; height:40; Rectangle { Text { text:props.__state.caption; } } }"};
  const compile=caption=>Runtime.compile_ui_scene_artifact(JSON.stringify(files),'App.ui',JSON.stringify({caption}));const first=compile('Browser state'),artifact=JSON.parse(first);equal(artifact.controls[0].state.caption.value,'Browser state');if(!artifact.templates.includes('Browser state'))throw Error('Captured state missing from template');
  const view=new Runtime();try{view.load_scene_artifact(first);const before=view.pixels(360,200,1).slice();view.load_scene_artifact(compile('Updated'));const after=view.pixels(360,200,1);if(!after.some((value,index)=>value!==before[index]))throw Error('Custom template state did not change visible frame');}finally{view.free();}
 });
 for(const chained of [false,true])await check(`WASM idle and reload reorder preserve ${chained?'chained':'single'} alias input`,()=>{
  const files={'App.ui':"component App { state items: List = []; Column { width:360; height:200; let visible = state.items; for item in visible key item.id { TextInput { width:200; height:32; value <-> item.title; } } } }".replace('for item in visible',chained?'let rows = visible; for item in rows':'for item in visible')};
  const view=new Runtime();try{
   view.load_ui_files_json(JSON.stringify(files),'App.ui',JSON.stringify({items:[{id:'a',title:'Alpha'},{id:'b',title:'Beta'}]}));equal(view.sync_ui_bindings(),false);const revision=view.layout_revision();
   for(let n=0;n<8;n++)equal(view.sync_ui_bindings(),false);equal(view.layout_revision(),revision);
   if(!view.focus_control(0))throw Error('Focus refused');view.text_key('End',false,false);if(!view.text_insert('—WASM-A'))throw Error('Insert refused');equal(view.sync_ui_bindings(),true);
   const edited=JSON.parse(view.ui_state_json()).items[0].title;equal(edited,'Alpha—WASM-A');for(let n=0;n<8;n++)equal(view.sync_ui_bindings(),false);
   const reordered=JSON.parse(view.ui_state_json());reordered.items.reverse();view.load_ui_files_json(JSON.stringify(files),'App.ui',JSON.stringify(reordered));equal(view.text_value(0),'Beta');equal(view.text_value(1),edited);equal(view.sync_ui_bindings(),false);
   const before=view.pixels(360,200,1).slice(),bounds=Array.from(view.control_bounds(0));
   if(!view.focus_control(0))throw Error('Reordered focus refused');view.text_key('End',false,false);if(!view.text_insert('—WASM-B'))throw Error('Reordered insert refused');equal(view.sync_ui_bindings(),true);
   const final=JSON.parse(view.ui_state_json());equal(final.items.map(item=>item.id),['b','a']);equal(final.items.map(item=>item.title),['Beta—WASM-B',edited]);for(let n=0;n<8;n++)equal(view.sync_ui_bindings(),false);
   const pixels=view.pixels(360,200,1).slice();let inside=0;for(let y=0;y<200;y++)for(let x=0;x<360;x++)if(x>=bounds[0]&&x<bounds[0]+bounds[2]&&y>=bounds[1]&&y<bounds[1]+bounds[3])for(let c=0;c<4;c++)if(before[(y*360+x)*4+c]!==pixels[(y*360+x)*4+c])inside++;
   if(!inside)throw Error('Reordered edit has no changed pixels within control');
   const figure=document.createElement('figure'),caption=document.createElement('figcaption'),canvas=document.createElement('canvas');caption.textContent=`Reload reorder ${chained?'chained':'single'}: `+final.items.map(item=>item.title).join(' / ');canvas.width=360;canvas.height=200;canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(pixels),360,200),0,0);figure.append(caption,canvas);document.querySelector('#report').before(figure);
   (report.reorderedFrames??=[]).push({chained,ids:final.items.map(item=>item.id),titles:final.items.map(item=>item.title),changedBytesInsideControl:inside,idleSyncs:24});
  }finally{view.free();}
 });
 await check('project reload refusal preserves model, focus, pixels and revisions',()=>{
  const project=value=>JSON.stringify({'App.ui':`component App { state query: String = '${value}'; Column { width:240; height:100; TextInput { key:'editor'; width:200; height:32; value <-> state.query; } } }`});
  const view=new Runtime();try{
   view.load_ui_files_json(project('old'),'App.ui','{}');view.focus_control(0);view.text_key('End',false,false);view.text_insert('—before');view.sync_ui_bindings();view.tick(1000);
   const snapshot=()=>({state:view.ui_state_json(),text:view.text_value(0),focus:view.focused_index(),geometry:view.geometry_revision(),layout:view.layout_revision(),visual:view.visual_revision()});
   const before=snapshot(),pixels=Array.from(view.pixels(240,100,1));
   for(const [files,entry,state] of [['{','App.ui','{}'],['{}','missing.ui','{}'],[JSON.stringify({'App.ui':'component App { Missing {} }'}),'App.ui','{}'],[project('next'),'App.ui','{']]){
    let refused=false;try{view.load_ui_files_json(files,entry,state);}catch{refused=true;}if(!refused)throw Error('Invalid project accepted');equal(snapshot(),before);equal(Array.from(view.pixels(240,100,1)),pixels);
   }
   view.text_insert('—after');equal(view.sync_ui_bindings(),true);equal(JSON.parse(view.ui_state_json()).query,'old—before—after');
   const previous=snapshot();view.load_ui_files_json(project('next'),'App.ui','{}');equal(view.text_value(0),'next');equal(view.geometry_revision(),(previous.geometry+1)>>>0);equal(view.layout_revision(),(previous.layout+1)>>>0);
  }finally{view.free();}
 });
await check('Live disabled TextInput binding locks and unlocks without reload',()=>{
 const assert=Object.assign(value=>{if(!value)throw Error('Assertion failed');},{equal,deepEqual:equal});
 const files={'App.ui':"component App { state locked: Bool = false; state query: String = 'seed'; Column { width:260; height:160; TextInput { key:'editor'; disabled:state.locked; width:200; height:32; value <-> state.query; } Toggle { key:'lock'; checked <-> state.locked; } } }",'Toggle.component.ui':"component Toggle { prop checked: Bool = false; width:100; height:24; Rectangle { PointerArea { clicked -> events.clicked(); } } }"};
 const view=new Runtime();try{
  view.load_ui_files_json(JSON.stringify(files),'App.ui','{}');assert(view.focus_control(0));view.text_key('End',false,false);view.text_insert('-kept');view.text_preedit('未確定');
  view.activate_control(1);assert(view.sync_ui_bindings());assert(view.control_disabled(0));assert(!view.text_editing());assert(!view.focus_control(0));assert(!view.text_insert('-blocked'));
  assert.equal(view.text_value(0),'seed-kept');assert.deepEqual(JSON.parse(view.ui_state_json()),{locked:true,query:'seed-kept'});
  const locked=JSON.parse(view.accessibility_tree_json()).nodes.find(n=>n.key==='editor');assert(locked.disabled);assert.deepEqual(locked.actions,[]);
  view.activate_control(1);assert(view.sync_ui_bindings());assert(!view.control_disabled(0));assert(view.focus_control(0));view.text_key('End',false,false);view.text_insert('-back');view.sync_ui_bindings();assert.deepEqual(JSON.parse(view.ui_state_json()),{locked:false,query:'seed-kept-back'});
 }finally{view.free();}
});
await check('Nested layout keeps control snapshots and live writes with unrelated payload',()=>{
 const assert=Object.assign(value=>{if(!value)throw Error('Assertion failed');},{equal});
 let body="TextInput { key:'editor'; width:100; height:32; value <-> state.query; }";for(let i=0;i<24;i++)body=`Column { width:200; height:100; ${body} }`;
 const files=JSON.stringify({'App.ui':`component App { state query: String = 'seed'; ${body} }`});const state=JSON.stringify({payload:Array.from({length:256},(_,i)=>({data:`payload-${i}`}))});
 const artifact=JSON.parse(Runtime.compile_ui_scene_artifact(files,'App.ui',state));assert.equal(artifact.controls.length,1);assert.equal(artifact.controls[0].state.payload.value.length,256);
 const view=new Runtime();try{
  view.load_ui_files_json(files,'App.ui',state);assert(view.focus_control(0));view.text_key('End',false,false);view.text_insert('-nested');assert(view.sync_ui_bindings());const model=JSON.parse(view.ui_state_json());assert.equal(model.query,'seed-nested');assert.equal(model.payload.length,256);assert.equal(model.payload[255].data,'payload-255');assert.equal(view.sync_ui_bindings(),false);
  const pixels=view.pixels(240,120,1);const figure=document.createElement('figure'),caption=document.createElement('figcaption'),canvas=document.createElement('canvas');caption.textContent=`24 nested layouts: ${model.query}; payload records: ${model.payload.length}`;canvas.width=240;canvas.height=120;canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(pixels),240,120),0,0);figure.append(caption,canvas);document.querySelector('#report').before(figure);
 }finally{view.free();}
});
await check('Large resolved List property retains contract type validation',()=>{
 const assert=Object.assign(value=>{if(!value)throw Error('Assertion failed');},{equal});
 const files={'App.ui':"component App { state payload: List = []; Column { width:200; height:100; Card { payload:state.payload; } } }",'Card.ui':"component Card { prop payload: List = []; width:100; height:32; Rectangle { background:#123456; PointerArea { clicked -> events.clicked(); } } }"};
 const state=JSON.stringify({payload:Array.from({length:256},(_,i)=>({data:`payload-${i}`}))});
 const artifact=JSON.parse(Runtime.compile_ui_scene_artifact(JSON.stringify(files),'App.ui',state));assert.equal(artifact.controls.length,1);assert.equal(artifact.controls[0].state.payload.value.length,256);
 const view=new Runtime();try{
  view.load_ui_files_json(JSON.stringify(files),'App.ui',state);assert.equal(view.control_count(),1);const before=view.ui_state_json(),revision=view.layout_revision();
  const invalid={...files,'App.ui':files['App.ui'].replace('payload:state.payload',"payload:'wrong-type'")};
  let refused=false;try{view.load_ui_files_json(JSON.stringify(invalid),'App.ui',state);}catch(error){refused=String(error).includes('expects List');}assert(refused);assert.equal(view.ui_state_json(),before);assert.equal(view.layout_revision(),revision);
 }finally{view.free();}
});
await check('Source wrappers throw atomically and recover after invalid markup/template',()=>{
 const assert=Object.assign(value=>{if(!value)throw Error('Assertion failed');},{equal});
 const view=new Runtime();try{
  const before={count:view.control_count(),layout:view.layout_revision(),geometry:view.geometry_revision()};
  for(const action of [()=>view.load('invalid markup'),()=>view.load_component('component Demo { Frame { width:200; height:100; Button { width:100; height:32; } } }','component Button {'),()=>Runtime.compile_ui_scene_artifact('{','App.ui','{}')]){
   let refused=false;try{action();}catch{refused=true;}assert(refused);assert.equal(view.control_count(),before.count);assert.equal(view.layout_revision(),before.layout);assert.equal(view.geometry_revision(),before.geometry);
  }
  view.load_ui_files_json(JSON.stringify({'App.ui':"component App { Column { width:200; height:100; TextInput { key:'editor'; value:'recovered'; width:180; height:32; } } }"}),'App.ui','{}');assert.equal(view.text_value(0),'recovered');
 }finally{view.free();}
});
await check('Modal blocks base scroll without cancelling its pressed control',()=>{
 const assert=Object.assign(value=>{if(!value)throw Error('Assertion failed');},{equal,deepEqual:equal});
 const view=new Runtime();try{
  view.load("component Demo { Frame { width:200; height:60; padding:10; clip:true; Scroll { Button { key:'base'; width:80; height:200; } } Modal { key:'ask'; x:20; y:40; width:160; height:80; Button { key:'yes'; width:60; height:24; } } } }");
  view.close_modal(0);view.scroll(0,1000);const offset=Array.from(view.scroll_offset()),base=Array.from(view.control_bounds(0));assert(offset[1]>0);view.open_modal(0);view.pointer(30,50,1);view.scroll(0,-20);assert.deepEqual(Array.from(view.scroll_offset()),offset);assert.deepEqual(Array.from(view.control_bounds(0)),base);view.pointer(30,50,2);assert.equal(view.control_clicks(1),1);view.close_modal(0);view.scroll(0,-20);assert(view.scroll_offset()[1]<offset[1]);
 }finally{view.free();}

await check('Portable CJK and emoji use real pixels and matching simple/shaped advances',()=>{
 const assert=Object.assign(value=>{if(!value)throw Error('Assertion failed');},{equal,notDeepEqual:(a,b)=>{if(JSON.stringify(a)===JSON.stringify(b))throw Error('Expected different glyph pixels');}});
 for(const value of ['你','🙂','你好 мир🙂']){
  const simple=Array.from(text_metrics(value,28)),shaped=Array.from(shaped_text_metrics(value,28));assert(simple[0]>0);assert(Math.abs(simple[0]-shaped[0])<0.001);
  const view=new Runtime(),question=new Runtime();try{
   const files=text=>JSON.stringify({'App.ui':`component App { Column { width:240; height:80; TextInput { width:220; height:40; fontSize:28; value:'${text}'; } } }`});
   view.load_ui_files_json(files(value),'App.ui','{}');question.load_ui_files_json(files('?'),'App.ui','{}');assert.equal(view.text_value(0),value);assert.notDeepEqual(Array.from(view.pixels(240,80,1)),Array.from(question.pixels(240,80,1)));
   view.focus_control(0);view.text_key('Home',false,false);const start=view.text_caret_bounds()[0];view.text_key('End',false,false);const end=view.text_caret_bounds()[0];assert(Math.abs(end-start-simple[0])<0.01);
   const pixels=view.pixels(240,80,1),figure=document.createElement('figure'),caption=document.createElement('figcaption'),canvas=document.createElement('canvas');caption.textContent=`Portable faces: ${value}`;canvas.width=240;canvas.height=80;canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(pixels),240,80),0,0);figure.append(caption,canvas);document.querySelector('#report').before(figure);
  }finally{view.free();question.free();}
 }
});
await check('dense Button content supports nested clips and mixed fonts at fractional DPI',()=>{
 const view=new Button();
 try {
  view.load_component(
   "component App { Frame { width:240; height:140; clip:false; background:#12345680; Button { x:31.3; y:23.7; width:68; height:49; } } }",
   "component Button { Rectangle { radius:4; background:#abcdef80; Text { text:'你好 мир🙂'; fontSize:12; color:#ffffff; } ContentClip { x:-6; y:-8; width:85; height:74; radius:6; } ContentShape { points:'-18 -14 80 -14 80 66 -18 66'; color:#ff000080; } ContentClip { x:12.3; y:8.7; width:40; height:30; radius:3; } ContentShape { points:'-2 -2 60 0 45 44'; color:#00ff0080; } ContentClipEnd {} ContentClipEnd {} } }");
  for(const scale of [.75,1,1.25,1.5,2]) {
   const pixels=view.content_pixels(240,190,scale);
   equal(pixels.length,240*190*4);
   if(!pixels.some((v,i)=>i%4===3&&v>0))throw Error('Dense content missing');
   equal(Array.from(view.content_pixels(240,190,scale)),Array.from(pixels));
  }
  const figure=document.createElement('figure'),caption=document.createElement('figcaption'),canvas=document.createElement('canvas');
  caption.textContent='Dense content: mixed fonts and nested clips';canvas.width=240;canvas.height=190;
  canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(view.pixels(240,190,1.25)),240,190),0,0);
  figure.append(caption,canvas);document.querySelector('#report').before(figure);
 }finally{view.free();}
});
await check('shared For/Let scopes retain unrelated payload and first/last writes',()=>{
 const view=new Runtime();
 try {
  const source="component App { state rows: List = []; state payload: List = []; Column { width:240; height:120; Scroll { width:220; height:100; Column { width:200; let cargo = state.payload; let visible = state.rows; for row in visible key row.id { TextInput { width:180; height:32; value <-> row.title; } } } } } }";
  const rows=Array.from({length:96},(_,i)=>({id:`row-${i}`,title:`row-${i} — 你好 мир🙂`}));
  const payload=Array.from({length:1024},(_,i)=>`unrelated-${i}-${'payload'.repeat(8)}`);
  view.load_ui_files_json(JSON.stringify({'App.ui':source}),'App.ui',JSON.stringify({rows,payload}));equal(view.control_count(),96);
  for(const [index,suffix] of [[0,'-browser'],[95,'-tail']]) {equal(view.focus_control(index),true);view.text_key('End',false,false);equal(view.text_insert(suffix),true);equal(view.sync_ui_bindings(),true);}
  const state=JSON.parse(view.ui_state_json());equal(state.payload,payload);equal(state.rows[0].title,rows[0].title+'-browser');equal(state.rows[95].title,rows[95].title+'-tail');equal(state.rows.slice(1,95),rows.slice(1,95));
  view.scroll(0,100000);
  for(const scale of [1,1.25,2]){const w=Math.ceil(240*scale),h=Math.ceil(120*scale);equal(view.pixels(w,h,scale).length,w*h*4);}
  const figure=document.createElement('figure'),caption=document.createElement('figcaption'),canvas=document.createElement('canvas');
  caption.textContent='Shared scopes96: '+state.rows[95].title+' / payload1024';canvas.width=240;canvas.height=120;
  canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(view.pixels(240,120,1)),240,120),0,0);
  figure.append(caption,canvas);document.querySelector('#report').before(figure);
 }finally{view.free();}
});
}catch(error){report.error=String(error.stack??error);}finally{runtime?.free();}
report.status=!report.error&&report.cases.length===19&&report.cases.every(x=>x.status==='passed')?'passed':'failed';
report.completedAt=new Date().toISOString();document.querySelector('#status').textContent=report.status;document.querySelector('#report').textContent=JSON.stringify(report,null,2);
await fetch('/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});
</script>
