[package]
name = "swap-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
blake3 = { version = "1.8", features = ["rayon"] }
memory-budget = { path = "../memory-budget", version = "0.1.0" }
rayon = "1.11"
tempfile = "3.27"
thiserror = "2.0"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
