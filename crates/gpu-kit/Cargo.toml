[package]
name = "gpu-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Reusable GPU building blocks over one wgpu-shaped API: backend selection, GPU resource credit leases, mesh and PBR material rendering"
license = "MIT OR Apache-2.0"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
memory-budget = { path = "../memory-budget", version = "0.1.0" }
thiserror = "2.0"

# `gpu_kit::wgpu` is Forma's Metal runtime on macOS and upstream wgpu elsewhere. Upstream wgpu 30
# needs a newer wasm-bindgen than Forma pins, so this crate stays outside the workspace with its
# own lockfile, like gpu-compute.
[target.'cfg(target_os = "macos")'.dependencies]
gpu-runtime = { path = "../gpu-runtime", version = "0.1.0" }
gpu-shader = { path = "../gpu-shader", version = "0.1.0", features = ["wgsl-in"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = "30.0"
naga = { version = "30.0", features = ["wgsl-in"] }

[dev-dependencies]
pollster = "0.4"

[lints.rust]
missing_debug_implementations = "warn"

[workspace]
