[package]
name = "compute-cuda"
version = "0.1.0"
edition = "2021"
publish = false
description = "CUDA tensor executor"
license = "MIT"

[dependencies]
gpu-compute = { path = "../gpu-compute", version = "0.1.0", features = ["cuda"] }
tensor-core = { path = "../tensor-core", version = "0.1.0" }

[dev-dependencies]
tensor-core = { path = "../tensor-core", version = "0.1.0", features = ["conformance"] }
