[package]
name = "gpu-shader"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false
description = "Custom multi-target shader parser, validator, and compiler (WGSL -> MSL, SPIR-V, HLSL, CUDA PTX, GLSL)"

[features]
default = ["wgsl-in"]
wgsl-in = []

[dependencies]
naga = { version = "=30.0.2", default-features = false, features = ["wgsl-in", "spv-out", "hlsl-out", "glsl-out", "wgsl-out"] }
spirv = "0.4"
