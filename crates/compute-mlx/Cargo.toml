[package]
name = "compute-mlx"
version = "0.1.0"
edition = "2021"
publish = false
description = "MLX tensor executor"
license = "MIT"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tensor-core = { path = "../tensor-core", version = "0.1.0" }
libloading = "0.8.9"

[dev-dependencies]
tensor-core = { path = "../tensor-core", version = "0.1.0", features = ["conformance"] }
half = "2.7.1"
