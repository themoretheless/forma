[package]
name = "forma-binding-example"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[features]
native = ["dep:winit", "dep:softbuffer"]

[dependencies]
forma = { path = "../.." }
winit = { version = "0.30", optional = true, default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
softbuffer = { version = "0.4", optional = true }

[build-dependencies]
forma-build = { path = "../../../forma-build" }
