[package]
name = "forma"
version = "0.3.5"
edition = "2021"
rust-version = "1.97.1"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "forma"
path = "src/main.rs"
required-features = ["native"]

[features]
native-test-hooks = ["native", "wgpu/test-hooks"]
native = ["dep:accesskit_winit", "dep:accesskit", "dep:winit", "dep:softbuffer", "gpu", "dep:objc"]
gpu = ["dep:wgpu", "dep:wgpu-linux", "dep:gpu-shader", "dep:gpu-compute", "dep:pollster", "dep:bytemuck"]

[dependencies]
unicode-segmentation = "=1.13.3"
themoretheless-tokenizer-forma = { git = "https://github.com/themoretheless/tokenizer", rev = "1c83ab03d879b085ec53ec5badf8abcc82c2ee3c", version = "0.8.0" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "=0.2.125"
accesskit = { version = "=0.25.2", optional = true }
accesskit_winit = { version = "=0.34.2", optional = true }
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
ttf-parser = "0.25.1"
gpu-shader = { path = "../gpu-shader", version = "0.1.0", optional = true }
gpu-compute = { path = "../gpu-compute", version = "0.1.0", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }

[dev-dependencies]
libc = "0.2"

# The in-tree runtime currently implements Metal only; Linux uses upstream wgpu's Vulkan backend.
[target.'cfg(target_os = "linux")'.dependencies]
wgpu-linux = { package = "wgpu", version = "=29.0.4", optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
wgpu = { package = "gpu-runtime", path = "../gpu-runtime", version = "0.1.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc = { version = "0.2", optional = true }

# The runtime is compute-bound on every keystroke: it parses the document and frames the
# template transport in one pass, so whole-program inlining matters more than build time.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
svet-wasm = { path = "../../packages/svet/crates/svet-wasm" }
