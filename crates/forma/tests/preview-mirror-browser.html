<!doctype html><meta charset="utf-8"><title>Rust semantic mirror cache</title><style>body{font:16px system-ui;margin:32px;background:#eef2f6}#editor{width:500px;min-height:140px}pre{white-space:pre-wrap}</style>
<h1>Rust semantic mirror cache</h1><p id="status">Loading…</p><div id="editor"></div><pre id="report"></pre>
<script type="module">
import init,* as wasm from '/wasm/forma.js';import {createVectorPreview} from '/src/vector-preview.js';
const report={status:'running',cases:[]};

 await init();let active;const calls={value:0,selection:0};class Observed extends wasm.Runtime{constructor(){super();active=this;}load_component(source){this.load_ui_files_json(source,'App.ui','{}');}text_value(index){calls.value++;return super.text_value(index);}text_selection_utf16(){calls.selection++;return super.text_selection_utf16();}}
 const preview=createVectorPreview({runtime:{...wasm,Runtime:Observed},onError:e=>{report.error=String(e);}});const initial='e'.repeat(4096)+'😀é';
 preview.render({container:document.querySelector('#editor'),source:JSON.stringify({'App.ui':`component App { state query: String = ${JSON.stringify(initial)}; Column { width:480; height:100; TextInput { key:'editor'; label:'Large field'; width:440; height:40; value <-> state.query; } } }`}),designMode:false,reducedMotion:true,previewControls:[{type:'TextInput',props:{key:'editor'}}]});preview.focusKey('editor');const input=document.querySelector('textarea');
 const base={...calls};for(let i=0;i<20;i++)window.dispatchEvent(new Event('resize'));if(calls.value!==base.value||calls.selection!==base.selection)throw Error('Unchanged mirror copied text');report.cases.push({name:'20 unchanged resize/sync events',getterDelta:{value:calls.value-base.value,selection:calls.selection-base.selection},status:'passed'});
 active.text_insert('X');window.dispatchEvent(new Event('resize'));if(input.value!==initial+'X')throw Error('Changed model not mirrored');if(calls.value!==base.value+1||calls.selection!==base.selection+1)throw Error('Changed mirror fetched repeatedly');report.cases.push({name:'Changed model refreshes once',valueLength:input.value.length,status:'passed'});
 const beforePreedit={...calls};active.text_preedit('未確定');window.dispatchEvent(new Event('resize'));active.text_preedit('');window.dispatchEvent(new Event('resize'));if(calls.value!==beforePreedit.value||calls.selection!==beforePreedit.selection)throw Error('Visual preedit changed semantic cache');report.cases.push({name:'Visual preedit retains semantic epoch',status:'passed'});const beforeEvents={...calls};for(let i=0;i<20;i++){input.dispatchEvent(new KeyboardEvent('keydown',{key:'Shift',shiftKey:true,bubbles:true,cancelable:true}));input.dispatchEvent(new Event('select'));}if(calls.value!==beforeEvents.value||calls.selection!==beforeEvents.selection)throw Error('Modifier/select copied unchanged text');report.cases.push({name:'20 unchanged modifier/select pairs',getterDelta:{value:calls.value-beforeEvents.value,selection:calls.selection-beforeEvents.selection},status:'passed'});report.calls=calls;report.status='passed';
 for(const type of ['keydown','beforeinput'])input.addEventListener(type,event=>queueMicrotask(()=>{(report.live??=[]).push({type,key:event.key,inputType:event.inputType,isTrusted:event.isTrusted,rustTail:wasm.Runtime.prototype.text_value.call(active,0).slice(-8),domTail:input.value.slice(-8),selection:Array.from(active.text_selection_utf16())});document.querySelector('#report').textContent=JSON.stringify(report,null,2);fetch('/result',{method:'POST',body:JSON.stringify(report)});}));
}catch(e){report.status='failed';report.error=String(e.stack);}
document.querySelector('#status').textContent=report.status.toUpperCase();document.querySelector('#report').textContent=JSON.stringify(report,null,2);await fetch('/result',{method:'POST',body:JSON.stringify(report)});
</script>
