[package]
name = "compute-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "WGSL tensor compute executor"
license = "MIT"

[dependencies]
wgpu = { package = "gpu-runtime", path = "../gpu-runtime", version = "0.1.0" }
gpu-compute = { path = "../gpu-compute", version = "0.1.0" }
tensor-core = { path = "../tensor-core", version = "0.1.0" }
naga = { package = "gpu-shader", path = "../gpu-shader", version = "0.1.0" }

[dev-dependencies]
tensor-core = { path = "../tensor-core", version = "0.1.0", features = ["conformance"] }
