# One workspace for every crate the repository builds: one lockfile, one target directory and one
# place for lints and profiles. Decisions and exclusions are explained in docs/adr/0001-cargo-workspace.md.
# Policy: `rust-version = "1.92"` is the minimum supported stable compiler for Cargo consumers, while
# `rust-toolchain.toml` pins the exact compiler used in CI for reproducible WASM artifacts and lint ratchets.
[workspace]
resolver = "2"
members = [
    "crates/memory-budget",
    "crates/swap-store",
    "crates/svet-graph",
    "crates/svet-reconcile",
    "crates/svet-gpu-arena",
    "crates/forma",
    "crates/forma-build",
    "crates/forma/examples/binding-app",
    "crates/forma/examples/language-app",
    "crates/gpu-shader",
    "crates/gpu-runtime",
    "crates/gpu-compute",
    "crates/gpu-kit",
    "crates/raster-core",
    "crates/math-core",
    "crates/math-compute",
    "crates/tensor-core",
    "crates/compute-core",
    "crates/compute-mlx",
    "crates/compute-cuda",
    "crates/forma-mcp",
]
default-members = [
    "crates/memory-budget",
    "crates/swap-store",
    "crates/svet-graph",
    "crates/svet-reconcile",
    "crates/svet-gpu-arena",
    "crates/forma",
    "crates/forma-build",
    "crates/forma/examples/binding-app",
    "crates/forma/examples/language-app",
    "crates/gpu-shader",
    "crates/gpu-runtime",
    "crates/gpu-compute",
    "crates/gpu-kit",
    "crates/raster-core",
    "crates/math-core",
    "crates/math-compute",
    "crates/tensor-core",
    "crates/compute-core",
    "crates/compute-mlx",
    "crates/compute-cuda",
    "crates/forma-mcp",
]
exclude = [
    # generated and checked-out crates, some with path dependencies on crates/forma
    ".forma",
    # a self-contained npm package: its wasm bytes are verified against its own lockfile and profile
    "packages/svet",
    # frozen source snapshots kept as benchmark evidence
    "crates/compute-core/benchmarks",
    "crates/compute-mlx/benchmarks",
    "crates/compute-mlx/qualification",
]

[workspace.package]
rust-version = "1.92"

# Was crates/forma/Cargo.toml [profile.release]: it ships the native runtime and forma.wasm.
[profile.release]
codegen-units = 1
lto = "fat"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false

[profile.dev.package.naga]
opt-level = 2

[profile.dev.package.gpu-shader]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.wgpu-types]
opt-level = 2

[profile.dev.package.spirv]
opt-level = 2

[profile.dev.package.skrifa]
opt-level = 2

[profile.dev.package.read-fonts]
opt-level = 2

[profile.test.package.naga]
opt-level = 2

[profile.test.package.gpu-shader]
opt-level = 2

[profile.test.package.wgpu-core]
opt-level = 2

[profile.test.package.wgpu-hal]
opt-level = 2

[profile.test.package.wgpu-types]
opt-level = 2

[profile.test.package.spirv]
opt-level = 2

[profile.test.package.skrifa]
opt-level = 2

[profile.test.package.read-fonts]
opt-level = 2
