name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime:
    name: Forma / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers
      # npm runs the linked tokenizer package's prepare (it builds the language WASM) even with
      # --ignore-scripts, and outside this directory, so the pinned toolchain has to be the default.
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            vector-ui/target
            native-app/target
            vector-ui/examples/binding-app/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-
      # The generated-form examples run the JS generator from build.rs, which needs the tokenizer
      # language package at the release commit Cargo.lock pins.
      - name: Matching wasm-bindgen CLI
        shell: bash
        run: |
          version=$(node scripts/versions.mjs wasm-bindgen)
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen $version" ]; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi
      - name: Tokenizer release pinned by Cargo.lock
        run: node scripts/tokenizer.mjs checkout install
      - run: npm ci
      - name: Forma tests (hardware tests remain explicit)
        run: cargo test --locked --manifest-path vector-ui/Cargo.toml --features gpu --lib --tests
      # Lavapipe gives Linux a software Vulkan adapter, so the GPU renderer tests that need a real
      # device (buffer reuse, CPU/GPU agreement across DPI) run on every PR, not only on a Mac by hand.
      - name: GPU renderer tests on software Vulkan (lavapipe)
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path vector-ui/Cargo.toml --features gpu --lib --tests -- --ignored
      - name: Design runner execution, cleanup and result limits
        run: node --test test/design-data-runner.test.js
      - name: Native Forma window compiles
        run: cargo check --locked --manifest-path vector-ui/Cargo.toml --features native --bin forma
      - name: Generated forms and native binding example
        run: cargo test --locked --manifest-path vector-ui/examples/binding-app/Cargo.toml --features native
      - name: Studio legacy WebView host compiles on macOS
        if: runner.os == 'macOS'
        run: cargo check --locked --manifest-path native-app/Cargo.toml
        env:
          FORMA_ACTIONS: ${{ github.workspace }}/.github/fixtures/actions.rs

  studio:
    name: Studio + actual WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      # npm runs the linked tokenizer package's prepare (it builds the language WASM) even with
      # --ignore-scripts, and outside this directory, so the pinned toolchain has to be the default.
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            vector-ui/target
          key: wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'vector-ui/Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-${{ runner.arch }}-
      - name: Matching wasm-bindgen CLI
        shell: bash
        run: |
          version=$(node scripts/versions.mjs wasm-bindgen)
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen $version" ]; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi
      - name: Tokenizer release pinned by Cargo.lock
        run: node scripts/tokenizer.mjs checkout install
      - run: npm ci
      - run: npm run version:check
      - run: npm run build:wasm
      - name: Require WASM integration tests (no missing-asset skips)
        run: node -e "for(const p of ['public/vector-pkg/forma.js','public/vector-pkg/forma_bg.wasm'])require('node:fs').accessSync(p)"
      - run: npm test
      - run: npm run build
      - run: npm run package:release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundles
          path: .release/*.tar.gz*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
