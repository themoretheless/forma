name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The GPU and compute crates have suites of their own that the Forma jobs never ran.
  # Hardware flags are not set here: hosted runners are not known to expose Metal or MLX, so device
  # tests return early on CI. `npm run gate` on a developer Mac sets the flags and runs them for real.
  crates:
    name: Crates / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/gpu-compute/target
            crates/gpu-kit/target
          key: crates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'crates/gpu-compute/Cargo.lock', 'crates/gpu-kit/Cargo.lock') }}
          restore-keys: crates-${{ runner.os }}-${{ runner.arch }}-
      - name: Workspace crates
        run: cargo test --locked -p gpu-shader -p gpu-runtime -p raster-core -p osv-math -p tensor-core -p compute-core -p compute-cuda -p memory-budget --features tensor-core/conformance
      - name: math-compute adapters
        run: cargo test --locked -p osv-math-compute --features gpu,tensor,tensor-wgsl
      - name: compute-mlx
        if: runner.os == 'macOS'
        run: cargo test --locked -p compute-mlx
      - name: gpu-compute on its own lockfile
        run: cargo test --locked --manifest-path crates/gpu-compute/Cargo.toml
      - name: gpu-kit on its own lockfile
        run: cargo test --locked --manifest-path crates/gpu-kit/Cargo.toml
      # The lint baseline was recorded on macOS with forma's native feature; Linux resolves a
      # different wgpu and would report different counts, so the ratchet runs on macOS only.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: runner.os == 'macOS'
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Clippy lint debt has not grown
        if: runner.os == 'macOS'
        run: node scripts/clippy-ratchet.mjs
  runtime:
    name: Forma / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Linux window dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers
      # npm runs the linked tokenizer package's prepare (it builds the language WASM) even with
      # --ignore-scripts, and outside this directory, so the pinned toolchain has to be the default.
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            target
            native-app/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-${{ runner.arch }}-
      # The generated-form examples run the JS generator from build.rs, which needs the tokenizer
      # language package at the release commit Cargo.lock pins.
      - name: Matching wasm-bindgen CLI
        shell: bash
        run: |
          version=$(node scripts/versions.mjs wasm-bindgen)
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen $version" ]; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi
      - name: Tokenizer release pinned by Cargo.lock
        run: node scripts/tokenizer.mjs checkout install
      - run: npm ci
      - name: Forma tests (hardware tests remain explicit)
        run: cargo test --locked --manifest-path crates/forma/Cargo.toml --features gpu --lib --tests
      # Lavapipe gives Linux a software Vulkan adapter, so the GPU renderer tests that need a real
      # device (buffer reuse, CPU/GPU agreement across DPI) run on every PR, not only on a Mac by hand.
      - name: GPU renderer tests on software Vulkan (lavapipe)
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
        run: cargo test --locked --manifest-path crates/forma/Cargo.toml --features gpu --lib --tests -- --ignored
      - name: Design runner execution, cleanup and result limits
        run: node --test test/design-data-runner.test.js
      # NativeHost/standalone IME and modifier regressions do not create OS windows.
      # --features gpu above does not compile native_window.rs or the binary tests.
      - name: Native host input and standalone regressions
        run: cargo test --locked --manifest-path crates/forma/Cargo.toml --features native --lib --bin forma
      - name: Generated forms and native binding example
        run: cargo test --locked --manifest-path crates/forma/examples/binding-app/Cargo.toml --features native
      - name: Studio legacy WebView host compiles on macOS
        if: runner.os == 'macOS'
        run: cargo check --locked --manifest-path native-app/Cargo.toml
        env:
          FORMA_ACTIONS: ${{ github.workspace }}/.github/fixtures/actions.rs

  studio:
    name: Studio + actual WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      # npm runs the linked tokenizer package's prepare (it builds the language WASM) even with
      # --ignore-scripts, and outside this directory, so the pinned toolchain has to be the default.
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustup default "$(rustup show active-toolchain | cut -d' ' -f1)"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            target
          key: wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-${{ runner.arch }}-
      - name: Matching wasm-bindgen CLI
        shell: bash
        run: |
          version=$(node scripts/versions.mjs wasm-bindgen)
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen $version" ]; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi
      - name: Tokenizer release pinned by Cargo.lock
        run: node scripts/tokenizer.mjs checkout install
      - run: npm ci
      - run: npm run version:check
      - run: npm run build:wasm
      - name: Native scene artifact and snapshot WASM contracts
        shell: bash
        run: |
          wasm-bindgen "${CARGO_TARGET_DIR:-target}/wasm32-unknown-unknown/release/forma.wasm" --target nodejs --out-dir "$RUNNER_TEMP/forma-node-contracts"
          node crates/forma/tests/check-scene-artifact-wasm.cjs "$RUNNER_TEMP/forma-node-contracts" "$RUNNER_TEMP/scene-artifact.json"
          node crates/forma/tests/check-scene-snapshot-wasm.cjs "$RUNNER_TEMP/forma-node-contracts" "$RUNNER_TEMP/scene-snapshot.json"
      - name: Require WASM integration tests (no missing-asset skips)
        run: node -e "for(const p of ['public/vector-pkg/forma.js','public/vector-pkg/forma_bg.wasm'])require('node:fs').accessSync(p)"
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package:release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundles
          path: .release/*.tar.gz*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  svet:
    name: Svet engine and installed package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/svet
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: packages/svet/package-lock.json
      - run: npm ci
      - name: Verify checked-in WASM against locked Rust sources
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/svet-wasm-provenance
          RUSTFLAGS: -C target-feature=+simd128
        run: |
          cargo build --locked --manifest-path crates/svet-wasm/Cargo.toml --target wasm32-unknown-unknown --release
          node scripts/check-wasm-provenance.mjs "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/svet_wasm.wasm" "${{ runner.temp }}/svet-wasm-provenance.json"
      - name: ESLint (suppressed findings may only shrink)
        run: npm run lint
      - name: Unchecked indexed access has not grown
        run: npm run typecheck:indexed
      - name: Build WASM, ESM package and demo
        run: npm run build
      - name: Engine and native Node regressions
        run: npm test
      - name: HTTP soak qualification and diagnostic accounting regressions
        run: python3 scripts/test_analyze_http_soak.py
      - name: Native HTTP action cancellation and concurrency
        run: npm run test:actions
      - name: Rust reactive graph and allocator regressions
        run: cargo test --locked --manifest-path crates/svet-wasm/Cargo.toml
      - name: Native owned graph binding projection
        run: cargo run --locked --manifest-path crates/svet-wasm/Cargo.toml --example native_bindings
      - name: Install tarball in an independent consumer and verify public APIs
        env:
          SVET_REBUILT_WASM: ${{ runner.temp }}/svet-wasm-provenance/wasm32-unknown-unknown/release/svet_wasm.wasm
        run: npm run test:package
