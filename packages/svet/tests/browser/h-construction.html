<!doctype html><meta charset="utf-8"><title>Svet construction lifetime</title>
<style>body{font:16px system-ui;max-width:1100px;margin:32px auto;color:#18232d}button{font:inherit;padding:8px 16px}pre{background:#eef6f1;padding:18px;line-height:1.7;white-space:pre-wrap}#preview{display:flex;gap:16px}</style>
<h1>Svet element and ref construction lifetime</h1><p>Prop getters, failed components, ref callbacks and native custom-element constructors.</p>
<button id="run">Run construction checks</button><pre id="result">Not run</pre><div id="preview"></div>
<script type="module">
import {bindProp,computed,createRoot,effect,getGraphTelemetry,h,onCleanup,resetReactiveSystem,signal} from '/src/engine/index.ts';
const run=document.querySelector('#run'),result=document.querySelector('#result'),preview=document.querySelector('#preview');let runNumber=0;
run.onclick=()=>{
 run.disabled=true;resetReactiveSystem();preview.replaceChildren();const lines=[],stops=[],sources=[];let fresh,observer;
 const check=(condition,label)=>{if(!condition)throw Error(label);lines.push('PASS '+label);result.textContent=lines.join('\n');};
 const fails=(callback,error)=>{try{callback();return false;}catch(value){return error?value===error:true;}};
 const source=()=>{const value=signal(0);sources.push(value);return value;};
 try{
  const metadataSource=source(),metadataFailure=Error('metadata failed');let metadataRuns=0,metadataFailed=false,metadataRetired=false;
  createRoot(stop=>{stops.push(stop);const before=getGraphTelemetry().nodes;metadataFailed=fails(()=>h('div',{get title(){effect(()=>{metadataSource();metadataRuns++;});throw metadataFailure;}}),metadataFailure);metadataRetired=getGraphTelemetry().nodes===before;});metadataSource.set(1);check(metadataFailed&&metadataRetired&&metadataRuns===1,'throwing prop metadata retires provisional effects while the caller stays live');
  let laterReads=0,staleProps=false;createRoot(stop=>{stops.push(stop);staleProps=fails(()=>h('div',{get title(){stop();return 'stale';},get id(){laterReads++;return 'later';}}));});check(staleProps&&laterReads===0,'owner teardown in a prop getter stops later metadata evaluation');
  const refSource=source(),refFailure=Error('ref failed');let retained,clicks=0,refRuns=0,refFailed=false,refRetired=false;
  createRoot(stop=>{stops.push(stop);const before=getGraphTelemetry().nodes;refFailed=fails(()=>h('input',{model:refSource,onClick(){clicks++;},ref(node){retained=node;effect(()=>{refSource();refRuns++;});throw refFailure;}}),refFailure);refRetired=getGraphTelemetry().nodes===before;});preview.append(retained);retained.click();refSource.set(1);check(refFailed&&refRetired&&clicks===0&&refRuns===1,'failed ref releases earlier event/model bindings and its own subscriptions');
  const host=document.createElement('div'),original=document.createTextNode('original child');host.append(original);preview.append(host);let refStopped=false;createRoot(stop=>{stops.push(stop);refStopped=fails(()=>h('div',{ref(){stop();}},original));});check(refStopped&&original.parentNode===host,'ref teardown prevents moving existing caller-owned children');
  const componentSource=source(),componentFailure=Error('component failed');let componentRuns=0,componentFailed=false;createRoot(stop=>{stops.push(stop);componentFailed=fails(()=>h(()=>{effect(()=>{componentSource();componentRuns++;});throw componentFailure;},null),componentFailure);});componentSource.set(1);check(componentFailed&&componentRuns===1,'caught component factory failure retires component-owned effects');
  let componentStopped=false;createRoot(stop=>{stops.push(stop);componentStopped=fails(()=>h(()=>{stop();return original;},null));});check(componentStopped&&original.parentNode===host,'component factory cannot publish output after caller disposal');
  let refCalls=0,publicRefFailed=false;createRoot(stop=>{stops.push(stop);stop();publicRefFailed=fails(()=>bindProp(document.createElement('div'),'ref',()=>{refCalls++;}));});check(publicRefFailed&&refCalls===0,'public ref binding preflights disposed callers before invoking the callback');
  let retireNative,nativeFailed=false;const tag='svet-construction-'+(++runNumber);customElements.define(tag,class extends HTMLElement{constructor(){super();retireNative();}});createRoot(stop=>{stops.push(stop);retireNative=stop;nativeFailed=fails(()=>h(tag,null));});check(nativeFailed,'native custom-element constructor teardown rejects an otherwise empty element');
  const teardownSource=source();let laterButton,derived,retireTree,teardownCalls=0,teardownRuns=0,teardownComputes=0,teardownObserved=-1;createRoot(stop=>{retireTree=stop;stops.push(stop);h('div',{ref(){onCleanup(()=>{laterButton.click();teardownSource.set(1);teardownObserved=derived();});}});laterButton=h('button',{onClick(){teardownCalls++;},ref(){derived=computed(()=>{teardownComputes++;return teardownSource();});effect(()=>{derived();teardownRuns++;});}});preview.append(laterButton);});retireTree();check(teardownCalls===0&&teardownRuns===1&&teardownComputes===1&&teardownObserved===0,'earlier sibling cleanup cannot execute descendants of a stopping ancestor');
  const values=[];let resetFailed=false,resetLater=0;createRoot(stop=>{stops.push(stop);resetFailed=fails(()=>h('div',{get title(){resetReactiveSystem();fresh=signal(17);observer=effect(()=>{values.push(fresh());});return 'stale';},get id(){resetLater++;return 'later';}}));});fresh.set(18);check(resetFailed&&resetLater===0&&values.join(',')==='17,18','metadata graph reset rejects old construction and preserves replacement effects');
  for(const stop of stops)stop();for(const value of sources)value.dispose();fresh.set(19);const survived=values.join(',')==='17,18,19';observer.dispose();observer=undefined;fresh.dispose();fresh=undefined;check(survived&&getGraphTelemetry().nodes===0,'old construction teardown preserves fresh lifetimes and final graph retirement');result.textContent=lines.join('\n')+'\n11/11 passed';
 }catch(error){result.textContent=lines.join('\n')+'\nFAIL '+(error.stack??error);}
 finally{for(const stop of stops)stop();for(const value of sources)value.dispose();observer?.dispose();fresh?.dispose();run.disabled=false;}
};
</script>
