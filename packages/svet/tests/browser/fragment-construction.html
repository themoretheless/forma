<!doctype html><meta charset="utf-8"><title>Svet Fragment construction</title>
<style>body{font:16px system-ui;max-width:1100px;margin:32px auto;color:#18232d}button{font:inherit;padding:8px 16px}pre{background:#eef6f1;padding:18px;line-height:1.7;white-space:pre-wrap}#preview{display:flex;gap:16px}</style>
<h1>Svet direct Fragment construction</h1><p>One metadata snapshot, owned failure cleanup, native reentry and reactive children after consumption.</p>
<button id="run">Run Fragment checks</button><pre id="result">Not run</pre><div id="preview"></div>
<script type="module">
import {computed,createRoot,effect,Fragment,getGraphTelemetry,onCleanup,resetReactiveSystem,signal} from '/src/engine/index.ts';
const run=document.querySelector('#run'),result=document.querySelector('#result'),preview=document.querySelector('#preview');
run.onclick=()=>{
 run.disabled=true;resetReactiveSystem();preview.replaceChildren();const lines=[],stops=[],sources=[];let fresh,observer;
 const check=(condition,label)=>{if(!condition)throw Error(label);lines.push('PASS '+label);result.textContent=lines.join('\n');};
 const fails=(callback,error)=>{try{callback();return false;}catch(value){return error?value===error:true;}};
 const source=()=>{const value=signal(0);sources.push(value);return value;};
 const withCreate=(factory,callback)=>{const descriptor=Object.getOwnPropertyDescriptor(document,'createDocumentFragment'),create=document.createDocumentFragment.bind(document);document.createDocumentFragment=()=>factory(create);try{return callback();}finally{if(descriptor)Object.defineProperty(document,'createDocumentFragment',descriptor);else delete document.createDocumentFragment;}};
 try{
  const live=source(),host=document.createElement('div');preview.append(host);let reads=0,disposeLive;createRoot(stop=>{disposeLive=stop;stops.push(stop);host.append(Fragment({get children(){reads++;return live;}}));});live.set(1);const updated=host.textContent==='1';disposeLive();live.set(2);check(reads===1&&updated&&host.textContent==='1','children metadata is read once and consumed reactive fragments update until owner teardown');
  const metadata=source(),failure=Error('metadata failed');let runs=0,metadataFailed=false,retired=false;createRoot(stop=>{stops.push(stop);const before=getGraphTelemetry().nodes;metadataFailed=fails(()=>Fragment({get children(){effect(()=>{metadata();runs++;});throw failure;}}),failure);retired=getGraphTelemetry().nodes===before;});metadata.set(1);check(metadataFailed&&retired&&runs===1,'throwing metadata retires provisional effects while its caller remains live');
  const original=document.createTextNode('original'),origin=document.createElement('div');origin.append(original);preview.append(origin);let stopReads=0,stopped=false;createRoot(stop=>{stops.push(stop);stopped=fails(()=>Fragment({get children(){stopReads++;stop();return original;}}));});check(stopped&&stopReads===1&&original.parentNode===origin,'metadata teardown stops without rereading or moving existing caller-owned nodes');
  let nativeCalls=0,disposedReads=0,disposedFailed=false;createRoot(stop=>{stops.push(stop);stop();withCreate(create=>{nativeCalls++;return create();},()=>{disposedFailed=fails(()=>Fragment({get children(){disposedReads++;return 'stale';}}));});});check(disposedFailed&&nativeCalls===0&&disposedReads===0,'disposed callers fail before native fragment creation and metadata access');
  let nativeReads=0,nativeFailed=false;createRoot(stop=>{stops.push(stop);withCreate(create=>{const fragment=create();stop();return fragment;},()=>{nativeFailed=fails(()=>Fragment({get children(){nativeReads++;return undefined;}}));});});check(nativeFailed&&nativeReads===0,'teardown inside native fragment creation rejects before children metadata');
  const coercion=source(),coercionFailure=Error('coercion failed');let coercionRuns=0,cleaned=0,coercionFailed=false;createRoot(stop=>{stops.push(stop);coercionFailed=fails(()=>Fragment({get children(){effect(()=>{coercion();coercionRuns++;});onCleanup(()=>{cleaned++;throw Error('cleanup failed');});return {toString(){throw coercionFailure;}};}}),coercionFailure);});coercion.set(1);check(coercionFailed&&coercionRuns===1&&cleaned===1,'child coercion failure retires metadata resources and preserves its primary exception');
  const trigger=source(),secondary=source();let rerunCallbacks=0,rerunComputes=0,rerunObserved=-1,derived;createRoot(stop=>{stops.push(stop);effect(()=>{trigger();Fragment({get children(){onCleanup(()=>{secondary.set(secondary.peek()+1);rerunObserved=derived();});return null;}});Fragment({get children(){derived=computed(()=>{rerunComputes++;return secondary();});effect(()=>{derived();rerunCallbacks++;});return null;}});});});trigger.set(1);check(rerunCallbacks===2&&rerunComputes===2&&rerunObserved===0,'effect rerun cleanup suppresses old later Fragment execution before rebuilding');
  const values=[];let resetReads=0,resetFailed=false;createRoot(stop=>{stops.push(stop);resetFailed=fails(()=>Fragment({get children(){resetReads++;resetReactiveSystem();fresh=signal(17);observer=effect(()=>{values.push(fresh());});return original;}}));});fresh.set(18);check(resetFailed&&resetReads===1&&original.parentNode===origin&&values.join(',')==='17,18','metadata reset rejects old output and preserves replacement graph lifetimes');
  for(const stop of stops)stop();for(const value of sources)value.dispose();fresh.set(19);const preserved=values.join(',')==='17,18,19';observer.dispose();observer=undefined;fresh.dispose();fresh=undefined;check(preserved&&getGraphTelemetry().nodes===0,'old Fragment scope cleanup cannot retire fresh effects and final graph state is empty');result.textContent=lines.join('\n')+'\n9/9 passed';
 }catch(error){result.textContent=lines.join('\n')+'\nFAIL '+(error.stack??error);}
 finally{for(const stop of stops)stop();for(const value of sources)value.dispose();observer?.dispose();fresh?.dispose();run.disabled=false;}
};
</script>
