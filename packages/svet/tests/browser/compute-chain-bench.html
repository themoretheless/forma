<!doctype html>
<meta charset="utf-8">
<title>Svet resident chain comparison</title>
<style>body{font:16px system-ui;max-width:1050px;margin:32px auto;padding:16px}pre{white-space:pre-wrap;background:#eff6ff;padding:16px}button{padding:12px}</style>
<h1>Svet resident chain comparison</h1>
<p>Three separate dispatch/readbacks versus one three-kernel GPU chain.
Same current engine, device, data and final observer; alternating batches.</p>
<button id="run">Run chain benchmark</button>
<pre id="status" role="status">Not run. First run scripts/prepare-compute-cache-bench.mjs.</pre>
<pre id="result"></pre>
<script type="module">
const prefix = '/node_modules/.cache/svet-compute-cache-bench';
const button = document.querySelector('#run'), status = document.querySelector('#status');
const first = `
@group(0) @binding(0) var<storage, read> a: array<f32>;
@group(0) @binding(1) var<storage, read> b: array<f32>;
@group(0) @binding(2) var<storage, read_write> output: array<f32>;
@compute @workgroup_size(64) fn main(@builtin(global_invocation_id) id: vec3<u32>) {
  if (id.x < arrayLength(&output)) { output[id.x] = a[id.x] * 2.0 + b[id.x]; }
}`;
const unary = `
@group(0) @binding(0) var<storage, read> previous: array<f32>;
@group(0) @binding(1) var<storage, read_write> output: array<f32>;
@compute @workgroup_size(64) fn main(@builtin(global_invocation_id) id: vec3<u32>) {
  if (id.x < arrayLength(&output)) { output[id.x] = previous[id.x] * 2.0 + 1.0; }
}`;
const median = values => [...values].sort((a,b) => a-b)[Math.floor(values.length/2)];
const assert = (condition, message) => { if (!condition) throw Error(message); };
button.addEventListener('click', async () => {
  button.disabled = true; status.textContent = 'Preparing engine snapshot and adapter…';
  document.querySelector('#result').textContent = '';
  let device, engine;
  try {
    const response = await fetch(prefix + '/metadata.json', { cache: 'no-store' });
    assert(response.ok, 'Prepare snapshots first');
    const metadata = await response.json();
    // Both modes use exactly this one frozen candidate engine; the old baseline
    // snapshot generated by the preparation script is not imported.
    engine = await import(/* @vite-ignore */ `${prefix}/${metadata.snapshot}/candidate/index.js`);
    const adapter = await navigator.gpu?.requestAdapter(); assert(adapter, 'No WebGPU adapter');
    const info = adapter.info ?? {};
    const adapterInfo = { vendor: info.vendor, architecture: info.architecture,
      device: info.device, description: info.description,
      isFallbackAdapter: info.isFallbackAdapter ?? adapter.isFallbackAdapter ?? null };
    device = await adapter.requestDevice();
    const unhandled = [];
    device.addEventListener('uncapturederror', event => unhandled.push(event.error.message));
    let counters;
    const submit = device.queue.submit.bind(device.queue), write = device.queue.writeBuffer.bind(device.queue);
    const createBuffer = device.createBuffer.bind(device), createPipeline = device.createComputePipeline.bind(device);
    device.queue.submit = (...args) => { counters.submissions++; return submit(...args); };
    device.queue.writeBuffer = (...args) => { counters.uploadedBytes += args[4]; return write(...args); };
    device.createComputePipeline = descriptor => { counters.pipelines++; return createPipeline(descriptor); };
    device.createBuffer = descriptor => {
      const buffer = createBuffer(descriptor); counters.buffers++;
      const map = buffer.mapAsync.bind(buffer), destroy = buffer.destroy.bind(buffer);
      let destroyed = false;
      buffer.mapAsync = (...args) => { counters.maps++; counters.readbackBytes += args[2] ?? descriptor.size; return map(...args); };
      buffer.destroy = () => { assert(!destroyed, 'Double destroy'); destroyed = true; counters.destroyed++; return destroy(); };
      return buffer;
    };
    const fresh = () => ({ submissions: 0, uploadedBytes: 0, readbackBytes: 0,
      maps: 0, pipelines: 0, buffers: 0, destroyed: 0 });
    engine.configureGpuSubsystem({ device });
    const workloads = [];
    for (const length of [7, 65536]) {
      const data = Float32Array.from({ length }, (_, i) => i % 97);
      const a = engine.createGpuTensor(data), b = engine.createGpuTensor(data);
      const midA = engine.createGpuTensor(length), midB = engine.createGpuTensor(length), output = engine.createGpuTensor(length);
      let publications = 0;
      const observer = engine.effect(() => { output(); publications++; });
      async function dispatch(mode, value) {
        a.setAt(0, value);
        if (mode === 'serial') {
          await engine.dispatchGpuComputeKernelAsync({ wgsl: first, inputs: [a,b], output: midA });
          await engine.dispatchGpuComputeKernelAsync({ wgsl: unary, inputs: [midA], output: midB });
          await engine.dispatchGpuComputeKernelAsync({ wgsl: unary, inputs: [midB], output });
        } else await engine.dispatchGpuComputeKernelAsync({ wgsl: first, inputs: [a,b], output,
          chain: [{ wgsl: unary }, { wgsl: unary }] });
        assert(output.peek()[0] === value * 8 + 3, 'Changed input result mismatch');
      }
      for (const mode of ['serial','chain']) {
        counters = fresh();
        for (let i = 0; i < 10; i++) await dispatch(mode, i);
        assert(counters.destroyed === counters.buffers, 'Warmup buffer leak');
      }
      const rounds = [];
      for (let round = 0; round < 7; round++) {
        const row = { round, order: round % 2 ? ['chain','serial'] : ['serial','chain'] };
        for (const mode of row.order) {
          counters = fresh(); const before = publications, start = performance.now();
          for (let i = 0; i < 30; i++) await dispatch(mode, i + 1);
          const milliseconds = performance.now() - start;
          const result = output.peek();
          for (let i = 1; i < length; i++) assert(result[i] === data[i] * 12 + 3, 'Final result tail mismatch');
          assert(publications - before === 30, 'Final result was not published exactly once per request');
          assert(counters.pipelines === 0, 'Warm pipeline recompiled');
          assert(counters.submissions === 30 * (mode === 'serial' ? 3 : 1), 'Submission count mismatch');
          assert(counters.maps === counters.submissions, 'Readback count mismatch');
          assert(counters.uploadedBytes === length * 30 * (mode === 'serial' ? 28 : 12), 'Upload size mismatch');
          assert(counters.readbackBytes === length * 30 * (mode === 'serial' ? 12 : 4), 'Readback size mismatch');
          assert(counters.buffers === 30 * (mode === 'serial' ? 10 : 5), 'Buffer count mismatch');
          assert(counters.destroyed === counters.buffers, 'Temporary buffers retained');
          const telemetry = engine.getGpuTelemetry();
          assert(!telemetry.pendingComputeCount && !telemetry.pendingComputeSnapshotBytes, 'Queue credits retained');
          row[mode] = { milliseconds, finalPublications: publications - before, ...counters };
        }
        rounds.push(row); status.textContent = `${length} floats: ${round + 1}/7 alternating rounds complete`;
      }
      const serialMs = median(rounds.map(row => row.serial.milliseconds));
      const chainMs = median(rounds.map(row => row.chain.milliseconds));
      workloads.push({ length, warmupRequestsPerMode: 10, requestsPerBatch: 30,
        kernelsPerRequest: 3, serialMedianBatchMs: serialMs, chainMedianBatchMs: chainMs,
        chainChangePercent: (chainMs / serialMs - 1) * 100, rounds });
      observer.dispose(); for (const tensor of [a,b,midA,midB,output]) tensor.dispose();
      assert(engine.getGraphTelemetry().nodes === 0, 'Graph nodes retained');
    }
    assert(!unhandled.length, 'Uncaptured GPU errors: ' + unhandled.join('; '));
    document.querySelector('#result').textContent = JSON.stringify({ measuredAt: new Date().toISOString(),
      userAgent: navigator.userAgent, adapter: adapterInfo, metadata, workloads,
      comparison: 'Both modes use the same candidate snapshot and warm pipeline cache. Serial uses private host intermediate tensors; both publish final output once.',
      scope: 'Sequential three-kernel request latency including snapshots, allocations, validation, publication and first-value checks. Device-to-device chain copies are not included in upload/readback byte counts. No GPU timestamp, frame-time, persistent resident-handle or cross-framework claim.',
    }, null, 2);
    status.textContent = 'PASS: all numerical, transfer, publication, buffer and queue checks passed.\n'
      + workloads.map(row => `${row.length} floats: serial ${row.serialMedianBatchMs.toFixed(3)} ms, chain ${row.chainMedianBatchMs.toFixed(3)} ms / 30 requests (${row.chainChangePercent.toFixed(2)}%)`).join('\n');
  } catch (error) { status.textContent = 'FAIL: ' + error.message; }
  finally { engine?.configureGpuSubsystem({ device: null }); device?.destroy(); button.disabled = false; }
});
</script>
