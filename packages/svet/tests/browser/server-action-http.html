<!doctype html><meta charset="utf-8"><title>Svet browser action HTTP checks</title>
<style>body{font:17px system-ui;max-width:1040px;margin:40px auto;color:#18232d}button{font:inherit;padding:8px 16px}pre{background:#eef6f1;padding:20px;line-height:1.7;white-space:pre-wrap}</style>
<h1>Svet browser action HTTP checks</h1><p>Real browser fetch against a loopback HTTP fixture; server-observed transport closure.</p>
<button id="run">Run browser HTTP checks</button><pre id="result">Not run</pre>
<script type="module">
import {createRoot,createServerAction,getGraphTelemetry,resetReactiveSystem,ServerActionDisposedError} from '/src/engine/index.ts';
const run=document.querySelector('#run'),result=document.querySelector('#result'),base='/__svet_action_http/';
const request=async(operation,id,extra='')=>{const response=await fetch(`${base}${operation}?id=${encodeURIComponent(id)}${extra}`,{cache:'no-store',signal:AbortSignal.timeout(5000)});if(!response.ok)throw Error(`Fixture ${operation}: ${response.status}`);return response.json();};
async function waitFor(id,predicate){const deadline=performance.now()+5000;while(performance.now()<deadline){const state=await request('stats',id);if(predicate(state))return state;}throw Error('Fixture state deadline exceeded');}
async function rejection(promise){try{await promise;return null;}catch(error){return error;}}
function bounded(promise){let timer;return Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('Browser operation deadline exceeded')),5000);})]).finally(()=>clearTimeout(timer));}
run.onclick=async()=>{
 run.disabled=true;resetReactiveSystem();const lines=[],actions=[],ids=[];let stop;
 const id=name=>{const value=`${Date.now()}-${Math.random().toString(16).slice(2)}-${name}`;ids.push(value);return value;};
 const check=(condition,label)=>{if(!condition)throw Error(label);lines.push('PASS '+label);result.textContent=lines.join('\n');};
 try{
  const before=id('headers');let abort,starts=0;
  const first=createServerAction({rpc:(_args,signal)=>{starts++;abort=signal;return fetch(`${base}wait?id=${before}`,{signal}).then(r=>r.json());}});actions.push(first);
  const outcome=rejection(first());await waitFor(before,state=>state.started);first.dispose();
  check(await bounded(outcome) instanceof ServerActionDisposedError&&abort.aborted,'disposal rejects the browser action and aborts its fetch signal');
  const beforeState=await waitFor(before,state=>state.closed);
  check(!beforeState.complete&&!beforeState.writableEnded,'server observes the unfinished response close before headers');
  const streaming=id('body');let bodyReady;
  const bodyStarted=new Promise(resolve=>{bodyReady=resolve;});let body;
  createRoot(dispose=>{stop=dispose;body=createServerAction({rpc:async(_args,signal)=>{const response=await fetch(`${base}wait?id=${streaming}&stream=1`,{signal});bodyReady();return response.json();}});});actions.push(body);
  const bodyOutcome=rejection(body());await bounded(bodyStarted);stop();
  const bodyError=await bounded(bodyOutcome),bodyState=await waitFor(streaming,state=>state.closed);
  check(bodyError instanceof ServerActionDisposedError&&!bodyState.complete&&!bodyState.writableEnded,'owner teardown cancels JSON body reading and closes the streaming response');
  check(getGraphTelemetry().nodes===0,'owner teardown releases all action graph nodes');
  const left=id('left'),right=id('right'),parallel=createServerAction({rpc:(key,signal)=>fetch(`${base}wait?id=${key}`,{signal}).then(r=>r.json())});actions.push(parallel);
  const a=parallel(left),b=parallel(right);void a.catch(()=>{});void b.catch(()=>{});
  await waitFor(left,state=>state.started);await waitFor(right,state=>state.started);await request('finish',left,'&value=1');
  check((await bounded(a)).value===1&&parallel.pending(),'first HTTP completion keeps the overlapping action pending');
  await request('finish',right,'&value=2');check((await bounded(b)).value===2&&!parallel.pending()&&parallel.error()===null,'both HTTP response bodies finish with consistent action state');
  parallel.dispose();const rejected=await rejection(first());
  check(rejected instanceof ServerActionDisposedError&&starts===1&&getGraphTelemetry().nodes===0,'disposed calls start no new fetch and all reactive resources are released');
  result.textContent=lines.join('\n')+'\n7/7 passed';
 }catch(error){result.textContent=lines.join('\n')+'\nFAIL '+(error.stack??error);}
 finally{stop?.();for(const action of actions)action.dispose();await Promise.allSettled(ids.map(value=>request('forget',value)));run.disabled=false;}
};
</script>
