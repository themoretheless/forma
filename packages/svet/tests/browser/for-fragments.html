<!doctype html>
<meta charset="utf-8">
<title>Svet keyed fragment row checks</title>
<style>body{font:16px system-ui;margin:40px auto;max-width:960px;padding:0 24px;color:#182231}button{font:inherit;padding:10px 18px}pre{background:#edf6f0;padding:20px;white-space:pre-wrap;line-height:1.6}#preview{padding:20px;border:1px solid #ccd6df;border-radius:8px;line-height:2}strong{color:#274f82}</style>
<h1>Svet keyed fragment row checks</h1>
<p>Native DOM checks for grouped rows, dynamic children, failed updates and owner teardown.</p>
<button id="run">Run fragment row checks</button>
<pre id="result">Not run</pre>
<p>Preview snapshot after successful recovery:</p><div id="preview"></div>
<script type="module">
import {For,Show,mount,signal,createGpuTensor,getGraphTelemetry,resetReactiveSystem} from '/src/engine/index.ts';
const output=document.querySelector('#result'),preview=document.querySelector('#preview'),button=document.querySelector('#run');
button.addEventListener('click',()=>{
  button.disabled=true;output.textContent='';let passed=0,app,items,visible;let rejectRow=true,renders=0;
  const check=(condition,label)=>{if(!condition)throw new Error(label);passed++;output.textContent+='PASS '+label+'\n';};
  try{
    resetReactiveSystem();items=signal([1,2]);visible=signal(false);
    app=mount(()=>For({each:items,children:id=>{
      renders++;createGpuTensor([id]);if(id===4&&rejectRow)throw new Error('row failed');
      const group=document.createDocumentFragment(),label=document.createElement('strong');label.textContent='Row '+id;
      group.append(label,Show({when:visible,children:()=>document.createTextNode(' details '+id)}),document.createElement('br'));return group;
    }}),preview);
    const first=Array.from(preview.querySelectorAll('strong'));visible.set(true);
    check(preview.textContent==='Row 1 details 1Row 2 details 2','fragment rows include dynamic Show content');
    items.set([2,1]);check(preview.querySelectorAll('strong')[1]===first[0]&&renders===2&&preview.textContent==='Row 2 details 2Row 1 details 1','reorder preserves complete groups and keyed node identity');
    items.set([1,3]);const beforeRemoval=getGraphTelemetry().nodes;items.set([3]);
    check(preview.textContent==='Row 3 details 3'&&getGraphTelemetry().nodes===beforeRemoval-2,'removal releases the row tensor and nested watcher');
    const stableNodes=getGraphTelemetry().nodes;let caught=false;try{items.set([5,4]);}catch(error){caught=error.message==='row failed';}
    check(caught&&preview.textContent==='Row 3 details 3'&&getGraphTelemetry().nodes===stableNodes,'failed preparation keeps committed DOM and releases staged groups');
    rejectRow=false;items.set([5,4]);check(preview.textContent==='Row 5 details 5Row 4 details 4','next notified update recovers the complete list');
    const original=preview.insertBefore,stable=Array.from(preview.querySelectorAll('strong')),baseline=getGraphTelemetry().nodes;
    preview.insertBefore=function(node,anchor){if(node.textContent==='Row 6')throw new Error('insert failed');return original.call(this,node,anchor);};
    caught=false;try{items.set([5,4,6]);}catch(error){caught=error.message==='insert failed';}finally{preview.insertBefore=original;}
    check(caught&&preview.querySelectorAll('strong').length===2&&preview.querySelectorAll('strong')[0]===stable[0]&&getGraphTelemetry().nodes===baseline,'partial range insertion rolls back without losing existing rows');
    const snapshot=preview.cloneNode(true);app.unmount();app=null;items.dispose();visible.dispose();
    check(getGraphTelemetry().nodes===0,'owner teardown returns all reactive nodes to zero');
    preview.replaceChildren(...snapshot.childNodes);output.textContent+=passed+'/7 passed';
  }catch(error){output.textContent+='FAIL '+(error.stack||error.message);}
  finally{app?.unmount();items?.dispose();visible?.dispose();button.disabled=false;}
});
</script>
