<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Svet Engine — Hybrid TypeScript + Rust WASM UI Framework</title>
    <style>
      :root {
        --bg: #0b0f19;
        --panel: #131a2a;
        --border: #23304d;
        --accent: #38bdf8;
        --accent-2: #818cf8;
        --success: #34d399;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      .container {
        max-width: 1120px;
        margin: 0 auto;
        padding: 2rem 1.5rem;
      }
      header {
        border-bottom: 1px solid var(--border);
        padding-bottom: 1.25rem;
        margin-bottom: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem 0;
        font-size: 2rem;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
        gap: 1.25rem;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.25rem;
      }
      .card h2 {
        margin-top: 0;
        font-size: 1.15rem;
        color: var(--accent);
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        padding: 0.4rem 0;
        border-bottom: 1px dashed var(--border);
        font-size: 0.92rem;
      }
      .stat-val {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--success);
        font-weight: 600;
      }
      button {
        background: linear-gradient(135deg, #0284c7, #4f46e5);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 0.5rem 0.9rem;
        cursor: pointer;
        font-weight: 600;
        margin-right: 0.5rem;
        margin-top: 0.5rem;
      }
      button:hover {
        opacity: 0.92;
      }
      ul.pill-list {
        list-style: none;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      ul.pill-list li {
        background: #1e293b;
        border: 1px solid var(--border);
        padding: 0.35rem 0.7rem;
        border-radius: 6px;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
