[package]
name = "svet-wasm"
version = "0.3.7"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Svet Engine C-ABI / WebAssembly adapter over svet-graph, svet-reconcile and svet-gpu-arena"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
svet-graph = { path = "../../../../crates/svet-graph", version = "0.3.7" }
svet-reconcile = { path = "../../../../crates/svet-reconcile", version = "0.3.7" }
svet-gpu-arena = { path = "../../../../crates/svet-gpu-arena", version = "0.3.7" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
