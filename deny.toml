# Supply-chain policy for the workspace: where code may come from, which licences are accepted
# and which duplicate or banned crates are tolerated. Checked by `cargo deny check` in the gate.
[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
    "aarch64-apple-ios",
    "aarch64-linux-android",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each entry is a known finding that is accepted for now, with the reason; see docs/refactor/BUGS.md.
ignore = [
    # Informational crate consolidation: merged into zbus 6.0 (zbus#2043). Pulled in only on Linux
    # via accesskit_winit 0.34.2 -> accesskit_unix 0.24.1 -> atspi 0.29.0 -> zbus 5.19.0; cannot be
    # disabled without disabling Linux AT-SPI accessibility until upstream migrates to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "merged into zbus 6.0 (zbus#2043); awaiting upstream accesskit_unix/atspi migration off zbus 5.19" },
    { id = "RUSTSEC-2026-0371", reason = "merged into zbus 6.0 (zbus#2043); awaiting upstream accesskit_unix/atspi migration off zbus 5.19" },
    { id = "RUSTSEC-2026-0372", reason = "merged into zbus 6.0 (zbus#2043); awaiting upstream accesskit_unix/atspi migration off zbus 5.19" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/themoretheless/tokenizer",
    # Dev-only: the benchmark worker protocol (crates/forma/examples/bench_support/protocol.rs).
    "https://github.com/themoretheless/airbug",
]
